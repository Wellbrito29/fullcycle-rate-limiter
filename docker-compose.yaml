services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: rate-limiter-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  tests:
    image: golang:1.24-alpine
    container_name: rate-limiter-tests
    working_dir: /src
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
    environment:
      REDIS_ADDR: redis:6379
      CGO_ENABLED: "0"
    command: go test -tags integration -count=1 ./...
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - test

volumes:
  gomodcache:
